<app-navbar></app-navbar>
<div class="content">
    @if (loading()) {
        <div>Loading...</div>
    } @else if (error()) {
        <div>{{ error() }}</div>
    } @else {
        @for (recipe of recipes(); track recipe.id) {
            <app-recipe-overview [recipe]="recipe"></app-recipe-overview>
        }
    }
</div>
