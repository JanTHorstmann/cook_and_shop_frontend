<div class="recipe_card">
    <div class="recipe_overview">
        <div class="recipe_info">
            <h2>{{ recipe.name }}</h2>
            <div class="recipe_meta">
                <p><img src="assets/images/difficult.png" alt=""> {{ recipe.difficulty }}</p>
                <p><img src="assets/images/preparation_time.png" alt="">{{ recipe.preparation_time }} min</p>
            </div>
            <p class="description">{{ recipe.instructions }}</p>
        </div>
        <div class="recipe_img">
            @if (recipe.recipe_img != null) {
                <img [src]="recipe.recipe_img" alt="">
            } @else {
                <img src="assets/images/no_picture_available.png" alt="">
            }
        </div>
    </div>

</div>
