<app-navbar></app-navbar>
<div class="content">
    @if (loading) {
        <div>Loading...</div>
    } @else if (error) {
        <div>{{ error }}</div>
    } @else {
        @for (recipeItem of recipeOverviewData; track $index) {
            <app-recipe-overview [recipe]="recipeItem"></app-recipe-overview>
        }
    }
</div>
